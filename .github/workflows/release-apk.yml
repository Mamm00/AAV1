# Builds and releases the Arena Android APK.
#
# Local Android SDK/JDK are not required: GitHub's ubuntu runner ships the
# Android SDK, and Gradle 8.9 is provisioned by gradle/actions (the wrapper
# jar is intentionally not committed).
#
# Triggers:
#  - workflow_dispatch: build the current ref, upload APK + (bootstrap)
#    signing keystore as workflow artifacts.
#  - push of a v* tag: build and attach the APK to that GitHub release.
#
# Signing:
#  - Preferred: repository secret ARENA_KEYSTORE_B64 (base64 .jks) plus
#    ARENA_KEYSTORE_PASSWORD / ARENA_KEY_ALIAS / ARENA_KEY_PASSWORD.
#  - Bootstrap: if no keystore secret exists, an ephemeral key is generated
#    and uploaded as an artifact so it can be promoted to a secret
#    (durable install/update continuity across releases).
#  - Last resort: the debug keystore signs the release build, so the job
#    still produces an installable APK.

name: release-apk

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest images already include ANDROID_HOME with accepted
      # licenses — no third-party SDK setup action needed.

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ARENA_KEYSTORE_B64 }}
          STOREPASS: ${{ secrets.ARENA_KEYSTORE_PASSWORD || 'arena-ci-2026' }}
          KEYPASS: ${{ secrets.ARENA_KEY_PASSWORD || 'arena-ci-2026' }}
          KEYALIAS: ${{ secrets.ARENA_KEY_ALIAS || 'arena' }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/arena-release.jks"
          GENERATED=0
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
            echo "Using repository signing secret."
          else
            echo "No keystore secret — generating bootstrap keystore."
            keytool -genkeypair \
              -keystore "$KEYSTORE_PATH" -storetype PKCS12 \
              -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -alias "$KEYALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Arena Android, O=Arena, C=US"
            GENERATED=1
            # Bundle keystore + credentials for promotion to repository
            # secrets (download the signing-keystore-bootstrap artifact).
            {
              echo "KEYSTORE_B64=$(base64 -w0 "$KEYSTORE_PATH")"
              echo "ARENA_KEYSTORE_PASSWORD=$STOREPASS"
              echo "ARENA_KEY_PASSWORD=$KEYPASS"
              echo "ARENA_KEY_ALIAS=$KEYALIAS"
            } > "$RUNNER_TEMP/signing-bootstrap.txt"
          fi
          {
            echo "ARENA_KEYSTORE_FILE=$KEYSTORE_PATH"
            echo "ARENA_KEYSTORE_PASSWORD=$STOREPASS"
            echo "ARENA_KEY_PASSWORD=$KEYPASS"
            echo "ARENA_KEY_ALIAS=$KEYALIAS"
          } >> "$GITHUB_ENV"
          echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"

      - name: Build debug + release APKs
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Runner log downloads are restricted in some environments, so surface
      # the failure excerpt as a check annotation (readable via the Checks
      # API on api.github.com) instead of relying on the raw logs.
      - name: Surface build errors as annotation
        if: failure() && steps.build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "build.log"
          text = log.read_text(errors="replace") if log.exists() else "(no build.log)"
          chunk = None
          for marker in ("What went wrong", "FAILURE:", "^e: ", "error: ", "Could not resolve"):
              if marker.startswith("^e: "):
                  idx = text.find("\ne: ")
                  if idx >= 0:
                      chunk = text[idx:idx + 24000]
                      break
                  continue
              idx = text.find(marker)
              if idx >= 0:
                  chunk = text[idx:idx + 24000]
                  break
          if chunk is None:
              chunk = text[-24000:]
          enc = chunk.replace("\r\n", "\n")
          enc = enc.replace("%", "%25").replace("\n", "%0A")
          print(f"::error title=Gradle build failed::{enc}")
          PY

      - name: Collect outputs
        id: collect
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apk-out"
          mkdir -p "$OUT"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/Arena-$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT/Arena-$VERSION-release.apk"
          # SHA-256 sidecar for the release notes
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt)
          ls -la "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload bootstrap signing keystore
        if: steps.keystore.outputs.generated == '1'
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore-bootstrap
          path: ${{ runner.temp }}/signing-bootstrap.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: arena-apk-${{ steps.collect.outputs.version }}
          path: ${{ runner.temp }}/apk-out/
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub release (tag pushes)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/apk-out"
          VERSION="${{ steps.collect.outputs.version }}"
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$OUT/Arena-$VERSION-release.apk" \
              "$OUT/Arena-$VERSION-debug.apk" \
              "$OUT/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$TAG" \
              --title "Arena for Android $TAG" \
              --generate-notes \
              "$OUT/Arena-$VERSION-release.apk" \
              "$OUT/Arena-$VERSION-debug.apk" \
              "$OUT/SHA256SUMS.txt"
          fi
